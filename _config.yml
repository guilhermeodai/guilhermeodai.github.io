# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Guilherme Almeida
description: UI/UX Designer and Game Dev
author: Guilherme Almeida
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://guilhermeodai.github.io" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  guilhermeodai

# RSS
feed:
  path: feed.xml
  title: "Articles and random thoughts from Guilherme Almeida, UI/UX Designer and Game Dev"

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-polyglot

# Data
custom:
  dates:
    start_year: 2025

# Collections
collections:
  portfolio-cases:
    output: true 
    permalink: /portfolio/case-studies/:title/
  
  portfolio-extras:
    output: true 
    permalink: /portfolio/side-quests/:title/

  portfolio-products:
    output: true
    permalink: /portfolio/product-design/:title/

# Defaults Front Matter
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "blog-post"
      author: "Guilherme Almeida"
  -
    scope:
      path: ""
      type: "portfolio-cases"
    values:
      layout: "portfolio-case"
      order: 99
  -
    scope:
      path: ""
      type: "portfolio-extras"
    values:
      layout: "portfolio-extra"
      order: 99
  -
    scope:
      path: ""
      type: "portfolio-products"
    values:
      layout: "portfolio-product"
      order: 99

# Polyglot
languages: ["en", "pt-BR"]
default_lang: "en"
exclude_from_localization: ["assets/fonts", "assets/icons", "assets/images", "css"]
parallel_localization: false

# Ignored Files
exclude:
  - templates/
  - _To-Do.md

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
